<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prism - AI Asistan</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--panel); padding: 15px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #334155; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; color: var(--accent); }
        .api-box { display: flex; gap: 5px; }
        .api-box input { padding: 5px 10px; font-size: 0.8rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; width: 160px; }
        .modes { display: flex; gap: 5px; overflow-x: auto; padding: 5px 0; }
        .mode-btn { background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
        .mode-btn.active { background: var(--accent); }
        .chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: var(--panel); padding: 10px 15px; border-radius: 10px; max-width: 85%; word-break: break-word; line-height: 1.4; }
        .message.user { align-self: flex-end; background: var(--accent); }
        .message.error { background: #ef4444; }
        .input-area { padding: 15px; background: var(--panel); display: flex; gap: 10px; border-top: 1px solid #334155; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
        button.send { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <h1>Prism AI</h1>
            <div class="api-box">
                <input type="password" id="apiKeyInput" placeholder="Gemini API Anahtarın">
            </div>
        </div>
        <div class="modes" id="modeSelector">
            <button class="mode-btn active" data-mode="normal">Normal</button>
            <button class="mode-btn" data-mode="iyi">İyi</button>
            <button class="mode-btn" data-mode="cok-iyi">Çok İyi</button>
            <button class="mode-btn" data-mode="ultra">Ultra</button>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message">Merhaba! Ben Prism. Sağ üstteki alana Gemini API anahtarını girerek benimle gerçek bir sohbete başlayabilirsin!</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Prism'e bir şeyler yaz...">
        <button class="send" id="sendBtn">Gönder</button>
    </div>

    <script>
        const buttons = document.querySelectorAll('.mode-btn');
        let currentMode = 'normal';

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.getAttribute('data-mode');
            });
        });

        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const chatContainer = document.getElementById('chatContainer');
        const apiKeyInput = document.getElementById('apiKeyInput');

        // Hafızadan eski anahtarı yükle
        if(localStorage.getItem('prism_gemini_key')) {
            apiKeyInput.value = localStorage.getItem('prism_gemini_key');
        }

        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('prism_gemini_key', apiKeyInput.value.trim());
        });

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!text) return;

            if (!apiKey) {
                alert("Lütfen sağ üstteki alana Gemini API anahtarını gir!");
                return;
            }

            // Kullanıcı mesajını ekle
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatContainer.appendChild(userMsg);
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Yükleniyor mesajı
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message';
            loadingMsg.textContent = 'Düşünüyor... (' + currentMode + ' mod)';
            chatContainer.appendChild(loadingMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Gemini API çağrısı
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                chatContainer.removeChild(loadingMsg);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    const aiMsg = document.createElement('div');
                    aiMsg.className = 'message';
                    aiMsg.textContent = aiReply;
                    chatContainer.appendChild(aiMsg);
                } else {
                    throw new Error(data.error?.message || "Geçersiz yanıt alındı.");
                }
            } catch (error) {
                if(chatContainer.contains(loadingMsg)) chatContainer.removeChild(loadingMsg);
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message error';
                errorMsg.textContent = 'Hata: ' + error.message;
                chatContainer.appendChild(errorMsg);
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
